[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jsboard"
version = "0.1.0"
description = "Crypto order book, market-making engine, and terminal depth display"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "aiohttp>=3.9",
    # TLS roots shipped with the package: relying on whatever CA store the
    # host OpenSSL points at fails on common macOS/Homebrew layouts.
    "certifi>=2024.2.2",
    "websockets>=12.0",
    "sortedcontainers>=2.4",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
jsboard = "jsboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
